# =====================================================================
# 3. VOLUMES
# =====================================================================
volumes:
  # MySQL data persistence
  mysql_data:
    driver: local
  # Nginx logs
  nginx_logs:
    driver: local
  # Composer dependencies (vendor folder)
  vendor_data:
    driver: local
  # NPM/Node dependencies (node_modules folder)
  node_modules_data:
    driver: local