# Dockerize Web Development Template (DWDT)

# =====================================================================
# 1. NETWORKS
# =====================================================================
networks:
  web-app:
    # Explicitly names the network using the COMPOSE_PROJECT_NAME variable
    name: ${COMPOSE_PROJECT_NAME}_app_net

# =====================================================================
# 2. SERVICES
# =====================================================================
services:
  # +----------------------+ #
  # | Container: NginX     | #
  # +----------------------+ #
  webserver:
    networks:
      - web-app
    container_name: nginx
    build:
      context: .
      dockerfile: containers/nginx/Dockerfile
    image: nginx:nginx-stable-alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - "${PATH_CONTAINERS}/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf"
      - nginx_logs:/var/log/nginx
      - "${PATH_SOURCE_LOCAL}:${PATH_SOURCE_LIVE}"
      # Vendor volume overlay
      - vendor_data:/var/www/html/vendor
      # Node Modules volume overlay
      - node_modules_data:/var/www/html/node_modules
    depends_on:
      - php
      - database

  # +----------------------+ #
  # | Container: PHP       | #
  # +----------------------+ #
  php:
    networks:
      - web-app
    container_name: php
    build:
      context: .
      dockerfile: containers/php/Dockerfile
      target: runtime
      args:
        PHP_VERSION: "${PHP_VERSION}"
        SYS_ENV: "${SYS_ENV}"
    image: php:php-${PHP_VERSION}-fpm-alpine
    ports:
      - "${PHP_PORT}:9000"
    volumes:
      - "${PATH_CONTAINERS}/php/config/php-${SYS_ENV}.ini:/usr/local/etc/php/conf.d/99-custom.ini"
      - "${PATH_SOURCE_LOCAL}:${PATH_SOURCE_LIVE}"

  # +----------------------+ #
  # | Container: MySQL     | #
  # +----------------------+ #
  database:
    networks:
      - web-app
    container_name: mysql
    build:
      context: .
      dockerfile: containers/mysql/Dockerfile
      args:
        DB_VERSION: "${DB_VERSION}"
    image: mysql:mysql-${DB_VERSION}
    restart: unless-stopped
    tty: true
    ports:
      - "${DB_PORT}:3306"
    env_file:
      - "${PATH_ENVIRONMENTS}/${SYS_ENV}.env"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql

  # +----------------------+ #
  # | Container: Composer  | #
  # +----------------------+ #
  composer:
    networks:
      - web-app
    container_name: composer
    build:
      context: .
      dockerfile: containers/composer/Dockerfile
      # This forces the 'php' service to be built first and makes the
      # resulting image available under the alias 'base'.
      additional_contexts:
        base: service:php
    image: composer:composer-2.7
    working_dir: /var/www/html
    volumes:
      - "${PATH_SOURCE_LOCAL}:${PATH_SOURCE_LIVE}"
      # Composer installs dependencies directly into this volume
      - vendor_data:/var/www/html/vendor
    depends_on:
      - php
    entrypoint: ['composer']

  # +----------------------+ #
  # | Container: NPM       | #
  # +----------------------+ #
  npm:
    networks:
      - web-app
    container_name: npm
    image: node:${NODE_VERSION}-alpine
    working_dir: /var/www/html
    volumes:
      - "${PATH_SOURCE_LOCAL}:${PATH_SOURCE_LIVE}"
      # Overlays the node_modules directory with a fast Docker volume
      - node_modules_data:/var/www/html/node_modules
    depends_on:
      - php
    entrypoint: ['npm']

