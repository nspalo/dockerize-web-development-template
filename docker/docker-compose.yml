# Dockerize Web Development Template (DWDT)
# ===========================================================================
# BASE CONFIGURATION
# ---------------------------------------------------------------------------
# This file contains settings common to ALL environments.
# It is always combined with an environment-specific override file:
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# ===========================================================================

# =====================================================================
# 1. NETWORKS
# =====================================================================
networks:
  web-app:
    # Explicitly names the network using the COMPOSE_PROJECT_NAME variable
    name: ${COMPOSE_PROJECT_NAME}_app_net

# =====================================================================
# 2. SERVICES
# =====================================================================
services:
  # +----------------------+ #
  # | Container: NginX     | #
  # +----------------------+ #
  webserver:
    networks:
      - web-app
    container_name: nginx
    build:
      context: .
      dockerfile: containers/nginx/Dockerfile
    image: nginx:nginx-stable-alpine
    depends_on:
      - php
      - database

  # +----------------------+ #
  # | Container: PHP       | #
  # +----------------------+ #
  php:
    networks:
      - web-app
    container_name: php
    build:
      context: .
      dockerfile: containers/php/Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION}"
        SYS_ENV: "${SYS_ENV}"
    image: php:php-${PHP_VERSION}-fpm-alpine

  # +----------------------+ #
  # | Container: MySQL     | #
  # +----------------------+ #
  database:
    networks:
      - web-app
    container_name: mysql
    build:
      context: .
      dockerfile: containers/mysql/Dockerfile
      args:
        DB_VERSION: "${DB_VERSION}"
    image: mysql:mysql-${DB_VERSION}
    env_file:
      - "${PATH_ENVIRONMENTS}/${SYS_ENV}.env"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql

  # +----------------------+ #
  # | Container: Composer  | #
  # +----------------------+ #
  composer:
    networks:
      - web-app
    container_name: composer
    build:
      context: .
      dockerfile: containers/composer/Dockerfile
      # This forces the 'php' service to be built first and makes the
      # resulting image available under the alias 'base'.
      additional_contexts:
        base: service:php
    image: composer:composer-2.7
    working_dir: /var/www/html
    volumes:
      - "${PATH_SOURCE_LOCAL}:${PATH_SOURCE_LIVE}"
      # Composer installs dependencies directly into this volume
      - vendor_data:/var/www/html/vendor
    depends_on:
      - php
    entrypoint: ['composer']

  # +----------------------+ #
  # | Container: NPM       | #
  # +----------------------+ #
  npm:
    networks:
      - web-app
    container_name: npm
    image: node:${NODE_VERSION}-alpine
    working_dir: /var/www/html
    volumes:
      - "${PATH_SOURCE_LOCAL}:${PATH_SOURCE_LIVE}"
      # Overlays the node_modules directory with a fast Docker volume
      - node_modules_data:/var/www/html/node_modules
    depends_on:
      - php
    entrypoint: ['npm']

# =====================================================================
# 3. VOLUMES
# =====================================================================
volumes:
  # MySQL data persistence
  mysql_data:
    driver: local
  # Composer dependencies (vendor folder)
  vendor_data:
    driver: local
  # NPM/Node dependencies (node_modules folder)
  node_modules_data:
    driver: local
